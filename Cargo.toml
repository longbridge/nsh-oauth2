[package]
name = "nsh-oauth2"
description = "OAuth 2 sign-in sessions for Native Shell (NSH) apps, an nshm: ASWebAuthenticationSession on iOS, a Custom Tab on Android, the system browser on the desktops."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/longbridge/nsh-oauth2"
readme = "README.md"
keywords = ["nshm", "nsh", "oauth2", "oauth"]
categories = ["authentication", "gui"]

[dependencies]
nsh-core = "0.7.2"
log = "0.4"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
url = "2"

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = "0.7.2"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIResponder", "UIView", "UIViewController", "UIWindow"] }
objc2-authentication-services = { version = "0.3.2", default-features = false, features = ["std", "block2", "ASWebAuthenticationSession"] }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = "0.7.2"

[dev-dependencies]
# Runs a Rust app headless: the desktop flow (browser, callback link).
nsh-engine = { version = "0.7.2", default-features = false }
nsh-testing = { version = "0.7.2", default-features = false }
